<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Consultas</title>

  <link rel="stylesheet" href="../css/historico.css">
</head>

<body>

<header class="navbar-global">
  <div class="nav-container">
    <div class="nav-column nav-left">
      <a href="index.html" class="logo-text">+Med</a>
    </div>

    <nav class="nav-column nav-center">
      <a href="index.html">Início</a>
      <a href="agendar.html">Agendar consulta</a>
      <a href="historico.html">Histórico</a>
      <a href="cadfuncionario.html">Verificar funcionário</a>
      <a href="canais.html">Canais de Atendimento</a>
    </nav>

    <div class="nav-column nav-right">
      <a href="login.html" class="nav-btn-blue">Login / Cadastro</a>
    </div>
  </div>
</header>

<main>
  <section class="container">
    <h1>Histórico de Consultas</h1>

    <p class="subtitulo">
      Confira abaixo as consultas agendadas no sistema.
    </p>

    <h2 id="totalConsultas"></h2>

    <button class="btn-limpar" onclick="limparHistorico()">
      Limpar histórico
    </button>

    <div id="listaConsultas" class="lista-consultas"></div>
  </section>
</main>

<script>
function carregarConsultas() {
  const lista = document.getElementById("listaConsultas");
  const consultas = JSON.parse(localStorage.getItem("consultas")) || [];

  document.getElementById("totalConsultas").innerText =
    `Total de consultas: ${consultas.length}`;

  if (consultas.length === 0) {
    lista.innerHTML = `
      <div class="vazio">
        <h2>Nenhuma consulta agendada</h2>
        <p>Quando uma consulta for agendada, ela aparecerá aqui.</p>
      </div>
    `;
    return;
  }

  lista.innerHTML = "";

  consultas.forEach((consulta, index) => {
    lista.innerHTML += `
      <div class="card-consulta">
        <h2>${consulta.tipo}</h2>
        <p><strong>Paciente:</strong> ${consulta.nome}</p>
        <p><strong>E-mail:</strong> ${consulta.email}</p>
        <p><strong>Data:</strong> ${consulta.data}</p>
        <p><strong>Horário:</strong> ${consulta.hora}</p>

        <button onclick="cancelarConsulta(${index})">
          Cancelar consulta
        </button>
      </div>
    `;
  });
}

function cancelarConsulta(index) {
  const consultas = JSON.parse(localStorage.getItem("consultas")) || [];

  const confirmar = confirm("Deseja realmente cancelar esta consulta?");

  if (!confirmar) {
    return;
  }

  consultas.splice(index, 1);

  localStorage.setItem("consultas", JSON.stringify(consultas));

  carregarConsultas();
}

function limparHistorico() {
  const confirmar = confirm("Deseja apagar todo o histórico de consultas?");

  if (!confirmar) {
    return;
  }

  localStorage.removeItem("consultas");

  carregarConsultas();
}

carregarConsultas();
</script>

</body>
</html>
